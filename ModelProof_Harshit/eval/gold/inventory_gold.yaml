# B11 format. risk_tier follows the policy tier matrix. Agents and prompts must never read eval/gold.
CR-PD-001:
  deterministic:
    platform_language: SAS
    documentation_status: outdated
    upstream_models: []
    downstream_models:
    - PR-RB-004
    input_data:
    - raw.german_credit
  llm:
    model_type: PD
    materiality: H
    complexity: L
    risk_tier: 2
    ai_ml_flag: false
    target_definition_contains:
    - bad
